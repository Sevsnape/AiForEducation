[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aiforec"
version = "0.1.0"
description = "Student-centric support AI with LangGraph (question gen, practice, counsel)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=0.2",
  "langchain-core>=0.3",
  "pydantic>=2",
  "pydantic-settings>=2",
  "sqlalchemy>=2",
  "python-dotenv>=1.0",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.6",
]

[project.scripts]
aiforec = "aiforec.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/aiforec"]

[tool.hatch.build.targets.sdist]
include = ["src/aiforec", "docs", "tests", "README.md"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
